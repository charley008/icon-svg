name: Build and release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tests and Docker startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Validate release version
        shell: bash
        run: |
          version=$(tr -d '\r\n' < cmd/icon-svg/VERSION)
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo 'Release tag must be v<major>.<minor>.<patch> and match cmd/icon-svg/VERSION' >&2
            exit 1
          fi
      - name: Test and check
        run: |
          go test ./...
          go vet ./...
          node --check web/static/site.js
          node --check web/static/theme.js
      - name: Build and start Docker with host library and data
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.build.yaml -p icon-svg-ci up -d --build --wait --wait-timeout 120
          curl --noproxy localhost --fail --silent http://127.0.0.1:1089/healthz
          docker compose -f docker-compose.yaml -f docker-compose.build.yaml -p icon-svg-ci exec -T icon-svg /app/icon-svg -version
          test -s data/runtime.sqlite3
          docker compose -f docker-compose.yaml -f docker-compose.build.yaml -p icon-svg-ci stop
          docker compose -f docker-compose.yaml -f docker-compose.build.yaml -p icon-svg-ci cp icon-svg:/app/data/runtime.sqlite3 "$RUNNER_TEMP/docker-initial.sqlite3"
          python -c "import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); assert c.execute('select count(*) from sqlite_master where name=?',('icons',)).fetchone()[0]==0; assert c.execute('select count(*) from audit').fetchone()[0]==0; assert c.execute('select count(*) from downloads').fetchone()[0]==0" "$RUNNER_TEMP/docker-initial.sqlite3"
          docker compose -f docker-compose.yaml -f docker-compose.build.yaml -p icon-svg-ci up -d --wait --wait-timeout 120
          curl --noproxy localhost --fail --silent http://127.0.0.1:1089/healthz
      - name: Check empty host directory initialization
        run: |
          image=$(docker compose -f docker-compose.yaml -f docker-compose.build.yaml -p icon-svg-ci images -q icon-svg)
          sudo python3 .github/scripts/check-docker-bootstrap.py "$image"
      - name: Docker logs
        if: failure()
        run: docker compose -f docker-compose.yaml -f docker-compose.build.yaml -p icon-svg-ci logs --tail 80
      - name: Clean up test container
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.build.yaml -p icon-svg-ci down --volumes

  docker:
    name: Publish Docker Hub image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Prepare Docker image name
        id: image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
          REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'icon-svg' }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo 'Configure GitHub repository secrets DOCKER_USERNAME and DOCKER_PASSWORD before tagging a release.' >&2
            exit 1
          fi
          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ || ! "$REPOSITORY" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo 'Invalid Docker Hub username or repository name.' >&2
            exit 1
          fi
          echo "name=$DOCKERHUB_USERNAME/$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push versioned image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.title=icon-svg
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish release and materials
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Package materials
        shell: bash
        run: |
          version=$(tr -d '\r\n' < cmd/icon-svg/VERSION)
          python3 .github/scripts/package-materials.py "dist/release/icon-svg-$version-materials.zip"
          cd dist/release
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > dist/release-notes.md <<'EOF'
          - 优化小 VPS 内存占用：改用磁盘索引、限制缓存，扫描后释放临时内存。
          - 减少启动、登录和设置操作中的重复素材加载。
          - 兼容现有 data、library 持久化目录，无需迁移数据。
          EOF
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/* --verify-tag --title "${RELEASE_TAG#v}" --notes-file dist/release-notes.md
          fi
